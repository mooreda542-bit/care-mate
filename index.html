<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareMate — منظم ومذكر الأدوية اليومي</title>

    <!-- Immediate direction setup to prevent layout flash on reload (Arabic default) -->
    <script>
      (function() {
        try {
          var lang = localStorage.getItem('caremate_language');
          if (lang) {
            var val = JSON.parse(lang);
            if (val === 'en') {
              document.documentElement.lang = 'en';
              document.documentElement.dir = 'ltr';
              return;
            }
          }
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        } catch(e) {}
      })();
    </script>

    <!-- Google Fonts: Plus Jakarta Sans (English) and Cairo (Arabic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-page text-charcoal antialiased selection:bg-primary-light selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
